[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full", "macros", "net", "rt-multi-thread", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = [
    "cors",
    "compression-full",
    "trace",
    "fs",
    "request-id",
] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "migrate", "macros", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde"] }
config = "0.15"
dotenvy = "0.15"
thiserror = "2"
anyhow = "1"
argon2 = "0.5"
rand = "0.9"
tower-cookies = "0.11"
validator = { version = "0.20", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
email_address = "0.2.9"
async-trait = "0.1.91"
chrono = {"version" = "0.4.45", features = ["serde"]}
base64 = "0.23.1"
sha2 = "0.11.0"
axum-extra = { version = "0.12.6", features = ["cookie"] }
