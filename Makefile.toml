[config]
default_to_workspace = false

[env]
DEV_ENV_FILE = ".env.dev"
DEV_COMPOSE_FILE = "compose.dev.yml"

[tasks.db-up]
command = "docker"
args = [
    "compose",
    "--env-file",
    "${DEV_ENV_FILE}",
    "-f",
    "${DEV_COMPOSE_FILE}",
    "up",
    "-d",
    "--wait",
    "postgres",
]

[tasks.db-down]
command = "docker"
args = [
    "compose",
    "--env-file",
    "${DEV_ENV_FILE}",
    "-f",
    "${DEV_COMPOSE_FILE}",
    "down",
]

[tasks.backend]
dependencies = ["db-up"]
env_files = ["${DEV_ENV_FILE}"]
command = "cargo"
args = ["run", "-p", "backend"]

[tasks.db-migrate]
dependencies = ["db-up"]
env_files = ["${DEV_ENV_FILE}"]
command = "./scripts/sqlx.sh"
args = ["migrate", "run", "--source", "backend/migrations"]

[tasks.sqlx-check]
dependencies = ["db-migrate"]
run_task = { name = "sqlx-check-inner", fork = true, cleanup_task = "db-down"}

[tasks.sqlx-check-inner]
private = true
env_files = ["${DEV_ENV_FILE}"]
command = "./scripts/sqlx.sh"
args = ["prepare", "--workspace", "--check", "--", "--all-targets", "--all-features"]

[tasks.sqlx-prepare]
dependencies = ["db-migrate"]
run_task = { name = "sqlx-prepare-inner", fork = true, cleanup_task = "db-down"}

[tasks.sqlx-prepare-inner]
private = true
env_files = ["${DEV_ENV_FILE}"]
command = "./scripts/sqlx.sh"
args = ["prepare", "--workspace", "--", "--all-targets", "--all-features"]

[tasks.rust-check]
env = { SQLX_OFFLINE = "true" }
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"]

[tasks.release-check]
dependencies = [
    "release-rust",
    "release-frontend",
    "release-docker",
]

[tasks.release-rust]
private = true
run_task = { name = ["db-migrate", "release-rust-inner"], fork = true, cleanup_task = "db-down" }

[tasks.release-rust-inner]
private = true
env = { SQLX_OFFLINE = "true" }
env_files = ["${DEV_ENV_FILE}"]
script = '''
export DATABASE_URL="postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}"

cargo fmt --all -- --check
cargo clippy --workspace --all-targets --all-features -- -D warnings
cargo test --workspace --all-targets --all-features
'''

[tasks.release-frontend]
private = true
cwd = "frontend"
script = '''
npm run format:check
npm run lint
npm run build
'''

[tasks.release-docker]
private = true
script = '''
docker build \
    -f backend/Dockerfile \
    -t aims-backend:release-check \
    .
    
docker build \
    -f frontend/Dockerfile \
    -t aims-frontend:release-check \
    .
'''

[tasks.release-verify-version]
script = '''
set -euo pipefail

VERSION="${@}"

if [ -z "$VERSION" ]; then
    echo "Usage: cargo make release-verify-version <version>"
    exit 1
fi

CARGO_VERSION="$(
    cargo metadata --no-deps --format-version 1 \
        | jq -r '.packages[] | select(.name == "backend") | .version'
)"

if [ "$CARGO_VERSION" != "$VERSION" ]; then
    echo "Version mismatch:"
    echo "  requested: $VERSION"
    echo "  workspace: $CARGO_VERSION"
    exit 1
fi

echo "Release version verified: $VERSION"
'''