[config]
default_to_workspace = false

[env]
DEV_ENV_FILE = ".env.dev"
DEV_COMPOSE_FILE = "compose.dev.yml"

[tasks.db-up]
command = "docker"
args = [
    "compose",
    "--env-file",
    "${DEV_ENV_FILE}",
    "-f",
    "${DEV_COMPOSE_FILE}",
    "up",
    "-d",
    "--wait",
    "postgres",
]

[tasks.db-down]
command = "docker"
args = [
    "compose",
    "--env-file",
    "${DEV_ENV_FILE}",
    "-f",
    "${DEV_COMPOSE_FILE}",
    "down",
]

[tasks.backend]
dependencies = ["db-up"]
env_files = ["${DEV_ENV_FILE}"]
command = "cargo"
args = ["run", "-p", "backend"]

[tasks.db-migrate]
dependencies = ["db-up"]
env_files = ["${DEV_ENV_FILE}"]
command = "./scripts/sqlx.sh"
args = ["migrate", "run", "--source", "backend/migrations"]

[tasks.sqlx-check]
dependencies = ["db-migrate"]
run_task = { name = "sqlx-check-inner", fork = true, cleanup_task = "db-down"}

[tasks.sqlx-check-inner]
private = true
env_files = ["${DEV_ENV_FILE}"]
command = "./scripts/sqlx.sh"
args = ["prepare", "--workspace", "--check", "--", "--all-targets", "--all-features"]

[tasks.sqlx-prepare]
dependencies = ["db-migrate"]
run_task = { name = "sqlx-prepare-inner", fork = true, cleanup_task = "db-down"}

[tasks.sqlx-prepare-inner]
private = true
env_files = ["${DEV_ENV_FILE}"]
command = "./scripts/sqlx.sh"
args = ["prepare", "--workspace", "--", "--all-targets", "--all-features"]

[tasks.rust-check]
env = { SQLX_OFFLINE = "true" }
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"]

[tasks.release-tag]
script = '''
set -euo pipefail

BRANCH="$(git branch --show-current)"

if [ "$BRANCH" != "main" ]; then
    echo "Release tags must be created from main."
    echo "Current branch: $BRANCH"
    exit 1
fi

if [ -n "$(git status --porcelain)" ]; then
    echo "Working tree is not clean."
    echo
    git status --short
    exit 1
fi

echo "Fetching origin..."
git fetch origin main --tags

LOCAL_COMMIT="$(git rev-parse HEAD)"
REMOTE_COMMIT="$(git rev-parse origin/main)"

if [ "$LOCAL_COMMIT" != "$REMOTE_COMMIT" ]; then
    echo "Local main does not match origin/main."
    echo
    echo "Local:  $LOCAL_COMMIT"
    echo "Remote: $REMOTE_COMMIT"
    echo
    echo "Run:"
    echo "  git pull --ff-only"
    exit 1
fi

VERSION="$(
    cargo metadata --no-deps --format-version 1 \
        | jq -r '.packages[] | select(.name == "backend") | .version'
)"

if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
    echo "Could not determine release version."
    exit 1
fi

TAG="v${VERSION}"

if git rev-parse "$TAG" >/dev/null 2>&1; then
    echo "Tag $TAG already exists locally."
    exit 1
fi

if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
    echo "Tag $TAG already exists on origin."
    exit 1
fi

echo
echo "Release:"
echo "  Version: $VERSION"
echo "  Tag:     $TAG"
echo "  Commit:  $LOCAL_COMMIT"
echo

git tag "$TAG"

echo "Created tag $TAG."

if ! git push origin "$TAG"; then
    echo "Failed to push $TAG."
    echo "Removing local tag."
    git tag -d "$TAG"
    exit 1
fi

echo
echo "Release tag $TAG pushed successfully."
'''
