name: Publish release binaries

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish binaries for"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: aimsctl (${{ matrix.architecture.arch }})
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - arch: amd64
            runner: ubuntu-24.04

          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.architecture.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.architecture.arch }}

      - name: Build release binary
        run: cargo build --release -p aimsctl

      - name: Prepare release asset
        shell: bash
        run: |
          set -euo pipefail

          cp \
            "target/release/aimsctl" \
            "aimsctl-linux-${{ matrix.architecture.arch }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: aimsctl-linux-${{ matrix.architecture.arch }}
          path: aimsctl-linux-${{ matrix.architecture.arch }}
          if-no-files-found: error
          
  release:
    name: Publish binaries
    needs:
      - build
  
    runs-on: ubuntu-latest
  
    permissions:
      contents: write
  
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: aimsctl-*
          merge-multiple: true
  
      - name: List downloaded artifacts
        run: ls -lah

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
  
          sha256sum \
            aimsctl-linux-amd64 \
            aimsctl-linux-arm64 \
            > SHA256SUMS
  
          cat SHA256SUMS
        
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              aimsctl-linux-amd64 \
              aimsctl-linux-arm64 \
              SHA256SUMS \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              aimsctl-linux-amd64 \
              aimsctl-linux-arm64 \
              SHA256SUMS \
              --verify-tag \
              --generate-notes \
              --title "Aims ${RELEASE_TAG#v}"
          fi