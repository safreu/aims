[package]
name = "aimsctl"
version.workspace = true
edition.workspace = true

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
rand = "0.10.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
self-replace = "1.5"
self_update = { version = "1.3", features = ["checksums"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
tempfile = "3.27.0"
thiserror = "2.0.20"

[dev-dependencies]
tempfile = "3.27.0"
